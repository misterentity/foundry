name: release

# Tag a version (e.g. v0.4.5) to build the installer and publish a GitHub Release.
# The in-app updater (tray → Check for updates) downloads the FoundrySetup.exe asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Code-signing is optional: add repo secrets SIGN_PFX_BASE64 (base64 of your .pfx) and
    # SIGN_PASSWORD to sign the app exe + installer. Without them, signing steps are skipped.
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Clean build first so the publish can't reuse a stale project-reference DLL
      # (a prior `dotnet test` build left MSBuild thinking Foundry.Core was up to date,
      #  which shipped a Core.dll without ProjectGenerator in v0.4.2–v0.4.4).
      - name: Publish (self-contained win-x64)
        run: dotnet publish Foundry.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o build/publish

      - name: Verify build integrity
        shell: pwsh
        run: |
          $pub = "build/publish"
          $core = (Resolve-Path "$pub/Foundry.Core.dll").Path
          $asm = [System.Reflection.Assembly]::LoadFile($core)

          # 1) Expected Core types — a stale project-reference DLL (the v0.4.2 class of bug) ships an
          #    older Foundry.Core.dll missing newer namespaces; assert every feature surface is present.
          $types = @(
            'Foundry.Core.Generation.ProjectGenerator','Foundry.Core.Update.GitHubUpdater','Foundry.Core.AppInfo',
            'Foundry.Core.Simulation.Avr8jsSimulator','Foundry.Core.Simulation.RenodeSimulator',  # live sim engines
            'Foundry.Core.Pcb.PcbBuilder','Foundry.Core.Pcb.PcbDesigner',                          # auto-PCB build + DRC loop
            'Foundry.Core.Pcb.Fab.GerberExporter','Foundry.Core.Pcb.Fab.FabService'                # gerbers + fab order
          )
          foreach ($t in $types) {
            if (-not $asm.GetType($t)) { Write-Error "MISSING type $t in $core — aborting release."; exit 1 }
          }

          # 2) Embedded KiCad/pcbnew scripts must be baked into Foundry.Core.dll (EmbeddedResource).
          $res = $asm.GetManifestResourceNames()
          $scripts = 'Foundry.Core.Pcb.KiCadScripts.build_board.py','Foundry.Core.Pcb.KiCadScripts.export_dsn.py','Foundry.Core.Pcb.KiCadScripts.import_ses.py'
          foreach ($r in $scripts) {
            if ($res -notcontains $r) { Write-Error "MISSING embedded resource $r in Foundry.Core.dll — aborting release."; exit 1 }
          }

          # 3) ClearScript V8 native lib must ship (Avr8jsSimulator hosts avr8js in V8 — without this the
          #    in-process AVR simulator throws at first use). RID-specific native; search the publish tree.
          $v8 = Get-ChildItem $pub -Recurse -Filter 'ClearScriptV8*.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $v8) { Write-Error "MISSING ClearScriptV8 native dll under $pub — avr8js sim would fail at runtime. Aborting release."; exit 1 }

          # 4) avr8js runtime bundle must ship beside the assembly (loaded by Avr8jsSimulator.BundlePath).
          $bundle = Join-Path $pub 'Assets/avr8js-runtime.js'
          if (-not (Test-Path $bundle)) { Write-Error "MISSING $bundle — avr8js sim has no runtime to load. Aborting release."; exit 1 }
          if ((Get-Item $bundle).Length -lt 10000) { Write-Error "avr8js-runtime.js looks truncated ($((Get-Item $bundle).Length) bytes) — aborting release."; exit 1 }

          Write-Host "OK: Foundry.Core.dll types + embedded scripts present; ClearScriptV8 native ($($v8.Name)) + avr8js bundle ($((Get-Item $bundle).Length) bytes) shipped."

      - name: Sign app exe (if cert configured)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: ./build/sign.ps1 -Target "build/publish/Foundry.exe"

      - name: Test
        run: dotnet test Foundry.Tests -c Release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze CAD sidecar (PyInstaller)
        working-directory: sidecar
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm ../build/sidecar.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\foundry.iss'

      - name: Sign installer (if cert configured)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: ./build/sign.ps1 -Target "build/AppPackages/FoundrySetup.exe"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/AppPackages/FoundrySetup.exe
          generate_release_notes: true
