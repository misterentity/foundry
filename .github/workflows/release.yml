name: release

# Tag a version (e.g. v0.4.5) to build the installer and publish a GitHub Release.
# The in-app updater (tray → Check for updates) downloads the FoundrySetup.exe asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Clean build first so the publish can't reuse a stale project-reference DLL
      # (a prior `dotnet test` build left MSBuild thinking Foundry.Core was up to date,
      #  which shipped a Core.dll without ProjectGenerator in v0.4.2–v0.4.4).
      - name: Publish (self-contained win-x64, no incremental)
        run: dotnet publish Foundry.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false --no-incremental -o build/publish

      - name: Verify build integrity
        shell: pwsh
        run: |
          $core = (Resolve-Path "build/publish/Foundry.Core.dll").Path
          $asm = [System.Reflection.Assembly]::LoadFile($core)
          $types = 'Foundry.Core.Generation.ProjectGenerator','Foundry.Core.Update.GitHubUpdater','Foundry.Core.AppInfo'
          foreach ($t in $types) {
            if (-not $asm.GetType($t)) { Write-Error "MISSING type $t in $core — aborting release."; exit 1 }
          }
          Write-Host "OK: published Foundry.Core.dll contains all expected types ($((Get-Item $core).Length) bytes)."

      - name: Test
        run: dotnet test Foundry.Tests -c Release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze CAD sidecar (PyInstaller)
        working-directory: sidecar
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm ../build/sidecar.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\foundry.iss'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/AppPackages/FoundrySetup.exe
          generate_release_notes: true
