name: ci

# Verify every change to main BEFORE a release tag is cut — the release workflow only runs on v* tags, so
# without this a regression sits on main unverified until release time. Runs the full unit suite + the
# pure-python pad-assignment tests on every push/PR, and the real-KiCad moat lane on PRs + main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The avr8js runtime ships as a COMMITTED bundle — fail if an index.js edit wasn't re-bundled.
      - name: avr8js bundle is fresh
        working-directory: sidecar-avr
        shell: pwsh
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist/avr8js-runtime.js
          if ($LASTEXITCODE -ne 0) { Write-Error "dist/avr8js-runtime.js is STALE — run 'npm run build' in sidecar-avr and commit it." }

      - name: Unit tests
        run: dotnet test Foundry.Tests -c Release --nologo

      - name: build_board.py pad-assignment unit tests (pytest, no KiCad)
        run: |
          python -m pip install --quiet pytest
          python -m pytest Foundry.Core/Pcb/KiCadScripts/test_build_board.py -q

  # The auto-PCB moat's correctness gate: build real boards on a real KiCad and read pad->net back to assert
  # it equals intent (incl. the fail-closed refusal of an unmapped logical pin). Gates merges so a net->pad
  # regression cannot reach main. Mirrors the release workflow's pcb-live lane.
  pcb-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install KiCad
        run: choco install kicad -y --no-progress

      - name: Add KiCad bin to PATH
        shell: pwsh
        run: |
          $bin = (Get-ChildItem 'C:\Program Files\KiCad' -Recurse -Filter 'kicad-cli.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).Directory.FullName
          if (-not $bin) { Write-Error 'kicad-cli.exe not found after choco install kicad'; exit 1 }
          Write-Host "KiCad bin: $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Sanity-check kicad-cli is available
        shell: pwsh
        run: kicad-cli version

      # FreeRouting (Java 25 + the pinned jar) so the fab e2e test routes a real board to DRC-clean + gerber ZIP.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch FreeRouting jar
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Foundry\tools\freerouting'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/freerouting/freerouting/releases/download/v2.2.4/freerouting-2.2.4.jar' -OutFile (Join-Path $dir 'freerouting-2.2.4.jar')

      - name: Live PCB toolchain tests (real KiCad/FreeRouting -> pad->net readback, fail-closed refusal, DRC-clean gerber ZIP)
        run: dotnet test Foundry.Tests -c Release --filter "FullyQualifiedName~PcbLive"

  # The avr8js live-sim chain: compile a real Uno blink sketch with arduino-cli and run it through avr8js in V8,
  # asserting real D13 edges surface through the same SimSession contract the breadboard uses. Without arduino-cli
  # installed the smoke test self-skips, so CI never exercised the live AVR sim — this lane makes it real.
  live-sim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install arduino-cli + AVR core
        shell: pwsh
        run: |
          choco install arduino-cli -y --no-progress
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: avr8js live-sim smoke test (real Uno blink -> D13 edges through V8)
        run: dotnet test Foundry.Tests -c Release --filter "FullyQualifiedName~Avr8jsLiveSmokeTest"
